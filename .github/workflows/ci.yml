name: CI

# Läuft bewusst nur manuell: GitHub-Actions-Hosted-Runner sind für dieses Repo
# per Enterprise-Policy deaktiviert. Lokal prüfen mit `npm test`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Round-Trip- und Rendering-Tests
        run: node test/roundtrip.test.mjs
      - name: Tests der AI-Antwortverarbeitung
        run: node test/ai.test.mjs
      - name: Proxy-Tests
        run: node test/proxy.test.mjs
      - name: XML gegen Schema validieren
        run: xmllint --noout --schema topo.xsd examples/my-canyon-inferiore.xml
      - name: App als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: topo-generator
          path: |
            index.html
            styles.css
            src
            vendor
            examples
            tools
            topo.xsd

name: Deploy to GitHub Pages

# Läuft bewusst nur manuell: GitHub Pages ist für private Repos in diesem Plan
# nicht verfügbar. Sobald das Repo öffentlich ist (oder der Plan Pages erlaubt),
# unter Settings > Pages "GitHub Actions" wählen und diesen Workflow starten.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Round-Trip- und Rendering-Tests
        run: node test/roundtrip.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
